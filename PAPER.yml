notes: 'Deliberate name mismatch: this repository was renamed scaffold-skill / PhiniteLab/scaffold-skill,
  but the skill it contains keeps its registered identity `popperian-coding` (SKILL.md name: field) because
  that identity is vendored byte-identical into published/exec-refute (the evaluation harness) and is
  the name under which the companion paper studied and reports on the skill. Renaming it would break the
  vendored copy''s provenance and silently desynchronize the studied artifact from what this repo publishes.


  Known gap, recorded rather than concealed: role is studied-artifact and paper_of_record is deliberately
  false. No LaTeX source for arXiv:2606.06454 exists anywhere on disk in this collection as of 2026-08-02
  — only a compiled PDF at published/exec-refute/makale1.pdf, with no .tex/.bib alongside it. latex_home
  is therefore null rather than pointing at a source tree that does not exist. If the LaTeX source surfaces
  later, update latex_home and reconsider paper_of_record together with whichever repo turns out to hold
  it (most likely published/exec-refute).


  frozen_strings note: the repository is scaffold-skill but the SKILL it ships is registered as `popperian-coding`
  (SKILL.md:2), and it installs to ~/.claude/skills/popperian-coding/. That mismatch is deliberate: the
  name is the skill''s identity as read by the Agent Skills loader, and a byte-identical copy is vendored
  inside published/exec-refute. Renaming either would desynchronise them.'
